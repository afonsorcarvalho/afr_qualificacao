# Snippet do vhost Apache do labquali (/etc/apache2/sites-enabled/012-labquali-le-ssl.conf).
#
# O PWA inteiro vive sob o basePath /app, então o proxy precisa de UMA regra
# só, para sempre: rota nova do app nunca mais exige mexer no Apache.
#
# SUBSTITUI, no bloco do PWA (apague tudo isto):
#   ProxyPass/ProxyPassReverse de /tecnico, /login, /_next, /api/odoo,
#   /api/groq, /api/chat, /icons, /manifest.json, /pdf.worker.min.mjs, /sw.js;
#   o ProxyPassMatch de workbox-*.js; e o LocationMatch antigo do sw.js.
# (A regra transitória de /sw.js pode simplesmente sumir: o SW antigo, de
# escopo /, nunca chegou a instalar em produção.)
#
# Posição: junto das demais regras do PWA, antes do `ProxyPass /` do Odoo.
# O RedirectMatch (mod_alias) roda antes do proxy e não depende da ordem,
# mas mantenha as regras juntas. Os redirects preservam links/atalhos
# antigos (/tecnico, /login, /cliente) levando-os para /app/...

ProxyTimeout 300
ProxyPass        /app  http://127.0.0.1:3010/app
ProxyPassReverse /app  http://127.0.0.1:3010/app
<LocationMatch "^/app/(sw\.js|workbox-[a-z0-9]+\.js)$">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
</LocationMatch>
RedirectMatch 301 ^/tecnico(.*)$   /app/tecnico$1
RedirectMatch 301 ^/login$         /app/login
RedirectMatch 301 ^/cliente(.*)$   /app/cliente$1

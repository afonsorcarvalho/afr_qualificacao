services:
  pwa:
    build:
      context: .
      dockerfile: Dockerfile
    image: afr_qualificacao_pwa:latest
    container_name: afr_qualificacao_pwa
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      NODE_ENV: production
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

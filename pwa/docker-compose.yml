services:
  pwa:
    build:
      context: .
      dockerfile: Dockerfile
    image: afr_qualificacao_pwa:latest
    container_name: afr_qualificacao_pwa
    restart: unless-stopped
    ports:
      # Só loopback: quem fala com o mundo é o proxy reverso com TLS
      # (`deploy/setup-pwa-proxy.sh`). Publicar 0.0.0.0:3010 deixaria o app
      # acessível em HTTP puro por fora, contornando o TLS — e sem contexto
      # seguro não há service worker nem instalação no aparelho.
      - "127.0.0.1:3010:3000"
    environment:
      NODE_ENV: production
      # OBRIGATÓRIA. Sem ela o proxy `/api/odoo` recusa tudo com 403 e o app
      # não fala com Odoo nenhum — em produção a allowlist não tem default,
      # porque encaminhar para endereço arbitrário transforma este servidor
      # em open proxy (SSRF: ele enxerga hosts internos que o navegador do
      # atacante não enxerga). Formato: `esquema://host[:porta]`, separado
      # por vírgula.
      ODOO_ALLOWED_ORIGINS: ${ODOO_ALLOWED_ORIGINS:?defina a allowlist de origens Odoo, ex. https://labquali.afrsistemas.com.br}
      # Assistente IA (auto-resumo, revisão, ditado) e chat de agendamento,
      # ambos via OpenRouter. Opcionais de propósito (`:-`, não `:?`): sem a
      # chave as rotas respondem 503/`enabled:false` e o resto do app sobe
      # normalmente — tornar obrigatória faria o app inteiro recusar subir
      # por causa de features acessórias. Sem estas linhas a chave no `.env`
      # NÃO chega ao container — foi assim que o chat subiu morto no
      # labquali em 2026-09-22.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Cadeia de fallback, separada por vírgula. Vazia usa o default do
      # código (`MODELOS_PADRAO` em `app/api/chat/route.ts`).
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
      # Modelo de transcrição (ditado). Vazia usa o default do código
      # (`MODELO_PADRAO` em `lib/llm/transcribe.ts`).
      OPENROUTER_STT_MODEL: ${OPENROUTER_STT_MODEL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
